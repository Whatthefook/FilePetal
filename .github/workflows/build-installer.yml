name: Build FilePetal downloads

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: windows-x64
            os: windows
          - runner: macos-15
            asset: macos-arm64
            os: macos
          - runner: macos-15-intel
            asset: macos-x64
            os: macos
          - runner: ubuntu-22.04
            asset: linux-x64
            os: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read application version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import ast; from pathlib import Path; module=ast.parse(Path("tangerine/paths.py").read_text(encoding="utf-8")); print(next(node.value.value for node in module.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "APP_VERSION" for target in node.targets)))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match APP_VERSION" >&2
            exit 1
          fi

      - name: Install Linux Qt runtime libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libpulse0 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxrender1 libxext6 libsm6 libice6 libglib2.0-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libxcb-randr0 libxcb-image0 \
            libxcb-render-util0 libxcb-shm0 libxcb-sync1 libxcb-xkb1 libxkbcommon-x11-0

      - name: Create macOS app icon
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          iconset="$RUNNER_TEMP/FilePetal.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o assets/icon.icns

      - name: Install Python packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ocr.txt
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build Windows portable ZIP
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -Python python -SkipInstaller
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\FilePetal-${{ steps.version.outputs.version }}-windows-x64.zip")) {
            throw "Windows ZIP was not produced"
          }

      - name: Build macOS app bundle and ZIP
        if: matrix.os == 'macos'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          TEMP: ${{ runner.temp }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean packaging/filepetal.spec
          test -d "dist/FilePetal.app"
          "dist/FilePetal.app/Contents/MacOS/FilePetal" --smoke-image-pdf
          python -c 'import json, os; from pathlib import Path; receipt=json.loads((Path(os.environ["TEMP"])/"Tangerine-image-pdf-smoke.json").read_text(encoding="utf-8")); assert receipt["ok"] and receipt["version"] == os.environ["EXPECTED_VERSION"] and receipt["ipc_requests"] == 2, receipt; print(json.dumps(receipt, indent=2))'
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/FilePetal.app" \
            "dist/FilePetal-${{ steps.version.outputs.version }}-${{ matrix.asset }}.zip"

      - name: Build Linux portable ZIP
        if: matrix.os == 'linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          TEMP: ${{ runner.temp }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean packaging/filepetal.spec
          test -x "dist/FilePetal/FilePetal"
          "dist/FilePetal/FilePetal" --smoke-image-pdf
          python -c 'import json, os; from pathlib import Path; receipt=json.loads((Path(os.environ["TEMP"])/"Tangerine-image-pdf-smoke.json").read_text(encoding="utf-8")); assert receipt["ok"] and receipt["version"] == os.environ["EXPECTED_VERSION"] and receipt["ipc_requests"] == 2, receipt; print(json.dumps(receipt, indent=2))'
          cat > dist/FilePetal/README-Linux.txt <<'EOF'
          FilePetal for Linux

          Launch with: ./FilePetal
          FilePetal is built for x86_64 Linux and Ubuntu 22.04 or newer.
          FFmpeg and FFprobe are optional system dependencies for audio/video features.
          Drop files on the small FilePetal companion window to open a wheel.
          EOF
          cd dist
          zip -qr "FilePetal-${{ steps.version.outputs.version }}-linux-x64.zip" FilePetal

      - name: Upload platform ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FilePetal-${{ steps.version.outputs.version }}-${{ matrix.asset }}
          path: dist/FilePetal-${{ steps.version.outputs.version }}-${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: FilePetal-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: FilePetal ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.zip
