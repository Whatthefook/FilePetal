<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="petal-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44"/>
      <stop offset="100%" stop-color="#F06015"/>
    </linearGradient>
    <linearGradient id="petal-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE58"/>
      <stop offset="100%" stop-color="#E85010"/>
    </linearGradient>
    <linearGradient id="hub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2824" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1A1816" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="petal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 6 Radial Petals -->
  <g filter="url(#petal-shadow)">
    <!-- Petal 1 (Top) -->
    <path d="M60 22 C67 22 72 32 70 42 C68 50 60 52 60 52 C60 52 52 50 50 42 C48 32 53 22 60 22 Z" fill="url(#petal-grad-1)"/>
    <!-- Petal 2 (Top Right) -->
    <path d="M60 22 C67 22 72 32 70 42 C68 50 60 52 60 52 C60 52 52 50 50 42 C48 32 53 22 60 22 Z" fill="url(#petal-grad-2)" transform="rotate(60 60 60)"/>
    <!-- Petal 3 (Bottom Right) -->
    <path d="M60 22 C67 22 72 32 70 42 C68 50 60 52 60 52 C60 52 52 50 50 42 C48 32 53 22 60 22 Z" fill="url(#petal-grad-1)" transform="rotate(120 60 60)"/>
    <!-- Petal 4 (Bottom) -->
    <path d="M60 22 C67 22 72 32 70 42 C68 50 60 52 60 52 C60 52 52 50 50 42 C48 32 53 22 60 22 Z" fill="url(#petal-grad-2)" transform="rotate(180 60 60)"/>
    <!-- Petal 5 (Bottom Left) -->
    <path d="M60 22 C67 22 72 32 70 42 C68 50 60 52 60 52 C60 52 52 50 50 42 C48 32 53 22 60 22 Z" fill="url(#petal-grad-1)" transform="rotate(240 60 60)"/>
    <!-- Petal 6 (Top Left) -->
    <path d="M60 22 C67 22 72 32 70 42 C68 50 60 52 60 52 C60 52 52 50 50 42 C48 32 53 22 60 22 Z" fill="url(#petal-grad-2)" transform="rotate(300 60 60)"/>
  </g>

  <!-- Central Frosted Hub -->
  <circle cx="60" cy="60" r="19" fill="url(#hub-grad)" stroke="#FFAA55" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="60" cy="60" r="7" fill="#FF8018"/>
  <circle cx="60" cy="60" r="3" fill="#FFE5CC"/>
</svg>
