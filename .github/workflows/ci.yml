name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.asset }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: windows-x64
            os: windows
          - runner: macos-15
            asset: macos-arm64
            os: macos
          - runner: macos-15-intel
            asset: macos-x64
            os: macos
          - runner: ubuntu-22.04
            asset: linux-x64
            os: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libpulse0 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxrender1 libxext6 libsm6 libice6 libglib2.0-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libxcb-randr0 libxcb-image0 \
            libxcb-render-util0 libxcb-shm0 libxcb-sync1 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile sources
        run: python -m compileall -q tangerine main.py

      - name: Run tests (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -s -vv
